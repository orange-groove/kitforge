name: Release

# Tag-driven release. Push `v0.3.0` to build a signed macOS Standalone DMG and
# publish it to GitHub Releases. Manual runs upload artifacts only (no publish).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for manual runs (e.g. 0.0.0-test)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  macos-release:
    name: macOS universal DMG
    runs-on: macos-14
    timeout-minutes: 60

    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      APPLE_ID:                 ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID:            ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD:       ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check out KitForge
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install build tools
        run: brew install ninja create-dmg ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-kitforge-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-kitforge-${{ runner.os }}-

      - name: Import signing certificate
        env:
          P12_BASE64:        ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD:      ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build + sign + notarize + DMG
        env:
          KITFORGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [macos-release]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.macos-release.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
