name: Release

# Tag-driven release (unsigned MVP). Push `v0.3.0` to build macOS DMG + Windows NSIS
# installer and publish both to GitHub Releases. No Apple signing secrets required.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for manual runs (e.g. 0.0.0-test)'
        required: false
        default: '0.0.0-dev'
      platform:
        description: 'Which platform(s) to build'
        type: choice
        options:
          - all
          - macos
          - windows
        default: all

permissions:
  contents: write

jobs:
  macos-release:
    name: macOS universal DMG (unsigned)
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'macos'
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out KitForge
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install build tools
        run: brew install ninja create-dmg ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-kitforge-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-kitforge-${{ runner.os }}-

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned DMG
        env:
          KITFORGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows-release:
    name: Windows installer (unsigned)
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out KitForge
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja + NSIS
        shell: pwsh
        run: |
          choco install ninja nsis -y --no-progress
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
              $nsisDir = "C:\Program Files\NSIS"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF.Substring("refs/tags/v".Length)
          } else {
            $v = "${{ github.event.inputs.version }}".TrimStart("v")
            if (-not $v) { $v = "0.0.0-dev" }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build unsigned NSIS installer
        shell: pwsh
        env:
          KITFORGE_VERSION: ${{ steps.version.outputs.version }}
        run: pwsh -File scripts/release.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*-Setup.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [macos-release, windows-release]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.macos-release.result != 'failure' &&
      needs.windows-release.result != 'failure' &&
      (needs.macos-release.result == 'success' || needs.windows-release.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS DMG
        if: needs.macos-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/macos

      - name: Download Windows installer
        if: needs.windows-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos/*
            dist/windows/*
          generate_release_notes: true
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
